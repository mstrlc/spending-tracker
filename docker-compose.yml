services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spending_tracker
      POSTGRES_USER: spending_tracker
      POSTGRES_PASSWORD: spending_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
