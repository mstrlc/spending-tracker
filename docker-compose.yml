services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spending_tracker
      POSTGRES_USER: spending_tracker
      POSTGRES_PASSWORD: spending_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The full app, production-built. Only started with --profile app; dev runs the API and web outside Docker.
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/spending_tracker
      APP_URL: ${APP_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    profiles: [app]
    build: web
    ports:
      - "8000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
